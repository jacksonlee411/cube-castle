version: "2"

sql:
  - engine: postgresql
    schema:
      - ../../database/schema.sql
    queries:
      - ../../sqlc/standardobject/queries.sql
    gen:
      go:
        package: sqlc
        out: ../../internal/standardobject/repository/sqlc
        sql_package: "database/sql"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "tstzrange"
            go_type: "string"
